[project]
name = "tutorial-scam-checker"
version = "0.1.0"
description = "Does this 'AI trading bot' from a YouTube tutorial actually trade, or just forward your funds?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # stdlib only, on purpose: easy to audit, nothing to supply-chain

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scamcheck = "scamcheck.__main__:main"
scamcheck-web = "scamcheck.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scamcheck"]

[tool.setuptools.package-data]
scamcheck = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
